name: 'MinioPlayMb'

on:
  schedule:
    - cron: "*/30 * * * *" 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Minio CLI
        run: |
          # Download and install
          https://dl.min.io/aistor/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc mb -p play/faasr
          
          
